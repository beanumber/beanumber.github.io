# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]

name: website

jobs:
  website:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
    
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          upgrade: 'TRUE'
          packages:
            any::emoji
            any::knitr
            any::remotes
            any::rmarkdown
            any::tidyverse

      - name: Install GitHub packages
        run: |
          Rscript -e 'install.packages("typstcv", repos = "https://kazuyanagimoto.r-universe.dev")'

      - name: Install EB Garamond fonts
        run: |
          ls -al fonts/*
          sudo cp fonts/*.ttf /usr/local/share/fonts/
          ls -lR /usr/local/share/fonts/
          sudo fc-cache -f -v
          quarto typst fonts

      - name: Install Quarto Extensions
        run: quarto install extension schochastics/academicons --no-prompt

      - name: Publish to GitHub Pages (and render)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
